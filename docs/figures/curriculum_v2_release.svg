<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="890" viewBox="0 0 1160 890" role="img" aria-labelledby="title desc">
<title id="title">课程 v2：预检、资格验证与冻结训练</title><desc id="desc">此图展开长期冻结流水线；单独的 curriculum_v2 run 不等于完成全部流水线门槛。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#61758a"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#25394c} .edge{fill:none;stroke:#61758a;stroke-width:2;marker-end:url(#arrow)} .label{font-size:16px;paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round}</style>
<rect width="1160" height="890" fill="white"/>
<text x="35" y="40" font-size="25" text-anchor="start" font-weight="600">课程 v2：预检、资格验证与冻结训练</text>
<text x="35" y="72" font-size="16" text-anchor="start">此图展开长期冻结流水线；单独的 curriculum_v2 run 不等于完成全部流水线门槛。</text>
<path class="edge" d="M410,197 L410,235"/>
<path class="edge" d="M410,317 L410,355"/>
<path class="edge" d="M410,437 L410,475"/>
<path class="edge" d="M410,557 L410,595"/>
<path class="edge" d="M410,677 L410,715"/>
<path class="edge" d="M775,396 L850,396"/>
<text class="label" x="812" y="380" text-anchor="middle">失败</text>
<rect x="45" y="115" width="730" height="82" rx="10" fill="#eaf5f0" stroke="#3d8066" stroke-width="1.5"/>
<text x="410.0" y="149.0" font-size="18" text-anchor="middle" font-weight="600">preflight：固定验证 / 测试场景</text>
<text x="410.0" y="175.0" font-size="16" text-anchor="middle">保留准入失败与种子，不按战斗成绩换场景</text>
<rect x="45" y="235" width="730" height="82" rx="10" fill="#eaf5f0" stroke="#3d8066" stroke-width="1.5"/>
<text x="410.0" y="269.0" font-size="18" text-anchor="middle" font-weight="600">benchmark：两类角色各完成至少两次更新</text>
<text x="410.0" y="295.0" font-size="16" text-anchor="middle">128 环境，检查恢复计数与 Actor 导出</text>
<rect x="45" y="355" width="730" height="82" rx="10" fill="#eaf5f0" stroke="#3d8066" stroke-width="1.5"/>
<text x="410.0" y="389.0" font-size="18" text-anchor="middle" font-weight="600">长期流水线核查回归与放行文件</text>
<text x="410.0" y="415.0" font-size="16" text-anchor="middle">缺测 / 物理 / 规则诊断；源码身份与测试</text>
<rect x="45" y="475" width="730" height="82" rx="10" fill="#eaf5f0" stroke="#3d8066" stroke-width="1.5"/>
<text x="410.0" y="509.0" font-size="18" text-anchor="middle" font-weight="600">冻结源码、配置、二进制、资产与 Python 环境</text>
<text x="410.0" y="535.0" font-size="16" text-anchor="middle">记录哈希与运行目录，从冻结副本启动</text>
<rect x="45" y="595" width="730" height="82" rx="10" fill="#f0ecfa" stroke="#8465ac" stroke-width="1.5"/>
<text x="410.0" y="629.0" font-size="18" text-anchor="middle" font-weight="600">正式训练：步兵 → 哨兵，各自从零开始</text>
<text x="410.0" y="655.0" font-size="16" text-anchor="middle">每角色累计十亿步；每次更新后验证 / 复核</text>
<rect x="45" y="715" width="730" height="82" rx="10" fill="#eaf5f0" stroke="#3d8066" stroke-width="1.5"/>
<text x="410.0" y="749.0" font-size="18" text-anchor="middle" font-weight="600">独立最终测试、Actor 导出与一致性核对</text>
<text x="410.0" y="775.0" font-size="16" text-anchor="middle">分别报告：预算完成 / 战斗门槛 / 热锁门槛</text>
<rect x="850" y="355" width="270" height="120" rx="10" fill="#fbeeee" stroke="#ad5454" stroke-width="1.5"/>
<text x="985.0" y="395.0" font-size="18" text-anchor="middle" font-weight="600">核查失败</text>
<text x="985.0" y="421.0" font-size="16" text-anchor="middle">保留失败与诊断产物</text>
<text x="985.0" y="447.0" font-size="16" text-anchor="middle">阻止正式启动</text>
<text x="35" y="845" font-size="16" text-anchor="start">资格验证步数不计入正式预算。检查点恢复使用原累计预算、环境数与课程，从新回合零隐藏状态开始。</text>
</svg>
